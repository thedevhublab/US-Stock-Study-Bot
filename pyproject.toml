[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-stock-study-bot"
version = "0.1.0"
description = "개인 맞춤형 미국 주식·경제 학습 Discord 봇"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.6,<3", "feedparser>=6.0.11,<7", "APScheduler>=3.11,<4", "python-dotenv>=1.0,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
ai = ["openai>=2.0,<3"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["studybot*"]
